<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120d22"><title>MELL MEMES</title><style>
*{box-sizing:border-box}body{margin:0;color:white;background:radial-gradient(circle at 10% 0%,#6938a3 0,transparent 40%),linear-gradient(140deg,#171126,#090911);font:16px system-ui,-apple-system,sans-serif;min-height:100vh}header{padding:30px 20px 18px;text-align:center}h1{font-size:38px;letter-spacing:-2px;margin:4px}small{color:#bcb4d4}.glass{background:#ffffff12;border:1px solid #ffffff25;box-shadow:0 12px 40px #0004;backdrop-filter:blur(18px);border-radius:25px}.wrap{max-width:900px;margin:auto;padding:0 16px 60px}.tabs{display:flex;gap:10px;padding:8px;margin-bottom:22px;position:sticky;top:8px;z-index:3}.tabs button{flex:1}.btn,button{border:0;color:white;background:#ffffff19;padding:12px 16px;border-radius:17px;font:inherit;cursor:pointer}.active,.primary{background:linear-gradient(120deg,#a34eff,#6332d7)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}.card{overflow:hidden}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,#a047fa,#25143b);display:grid;place-items:center;font-size:65px}.card .info{padding:16px}.card h2{font-size:20px;margin:0 0 12px}.actions{display:flex;gap:8px;align-items:center}.actions button{font-size:15px}.muted{color:#bdb3d1;font-size:13px}.panel{padding:20px;margin-bottom:20px}.panel input{width:100%;margin:8px 0 12px;padding:13px;border-radius:14px;border:1px solid #ffffff45;background:#ffffff12;color:white;font:inherit}a{color:#d8b5ff}footer{text-align:center;color:#a59abf;padding:20px}.hidden{display:none}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#15121e}video{width:100%;aspect-ratio:9/12;object-fit:contain;background:#090911;display:block}.notice{padding:12px;color:#d8b5ff}
</style></head><body><header><div>💜 ФАН-САЙТ</div><h1>MELL MEMES 💀</h1><small>Мемы, реакции и видео • стеклянный дизайн</small></header><main class="wrap"><nav class="tabs glass"><button id="photos" class="active" onclick="tab('photos')">😂 Мемы</button><button id="videos" onclick="tab('videos')">🎬 Видео</button><button id="saved" onclick="tab('saved')">❤️ Избранное</button></nav><section id="add" class="panel glass"><h2>Добавить свой мем</h2><input id="caption" placeholder="Подпись к мему"><input id="imageurl" placeholder="Ссылка на фото (https://...)"><button class="primary" onclick="addMeme()">Добавить фото</button><p class="muted">Добавленные мемы и лайки сохраняются только в этом браузере.</p></section><section id="addvideo" class="panel glass hidden"><h2>Добавить YouTube-видео</h2><input id="videourl" placeholder="Ссылка на YouTube"><input id="videotitle" placeholder="Название ролика"><button class="primary" onclick="addVideo()">Добавить видео</button><p class="muted">Встраивание зависит от разрешений автора ролика.</p></section><section id="feed" class="grid"></section><footer>Неофициальный фан-сайт • MELL MEMES</footer></main><script>
const defaults=[{id:1,title:'КОГДА ЗАШЁЛ НА СТРИМ НА 5 МИНУТ 💀',emoji:'😭'},{id:2,title:'КОГДА УВИДЕЛ ОЦЕНКУ ПО ГЕОМЕТРИИ',emoji:'🤯'},{id:3,title:'ТОТ САМЫЙ МОМЕНТ НА СТРИМЕ',emoji:'😂'},{id:4,title:'КОГДА ИНТЕРНЕТ ЗАЛАГАЛ В САМЫЙ ВАЖНЫЙ МОМЕНТ',emoji:'🗿'}];const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};const publicVideos=[{id:101,title:'MELL MEMES — видео №1',file:'72e76e27edeb89e30c460ca87a0e5b95.mp4'},{id:102,title:'MELL MEMES — видео №2',file:'TikTok_7686169800334265633.mp4'},{id:103,title:'MELL MEMES — видео №3',file:'TikTok_7604730203708951830.mp4'},{id:104,title:'MELL MEMES — видео №4',file:'TikTok_7665258243047951623.mp4'},{id:105,title:'MELL MEMES — видео №5',file:'ddecd6bbd25e87d3eb32025a1f1de95c.mp4'},{id:106,title:'MELL MEMES — видео №6',file:'TikTok_7655459808241339668.mp4'}];let memes=get('mell-memes',defaults),videos=[...publicVideos,...get('mell-videos',[])],likes=get('mell-likes',[]),mode='photos';const save=()=>{localStorage.setItem('mell-memes',JSON.stringify(memes));localStorage.setItem('mell-videos',JSON.stringify(videos));localStorage.setItem('mell-likes',JSON.stringify(likes))};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tab(t){mode=t;for(const b of ['photos','videos','saved'])document.getElementById(b).classList.toggle('active',b===t);document.getElementById('add').classList.toggle('hidden',t!=='photos');document.getElementById('addvideo').classList.toggle('hidden',t!=='videos');render()}function like(id){likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];save();render()}function render(){const list=mode==='videos'?videos:mode==='saved'?memes.filter(m=>likes.includes(m.id)):memes;document.getElementById('feed').innerHTML=list.length?list.map(m=>'<article class="card glass">'+(m.file?'<video controls playsinline preload="metadata" src="'+escapeHtml(m.file)+'" onerror="this.outerHTML=\'<div class=notice>Видео готовится к публикации ⏳</div>\'"></video>':m.file?'<video controls playsinline preload="metadata" style="width:100%;aspect-ratio:16/9;background:#000" src="'+encodeURI(m.file)+'"></video>':m.youtube?'<iframe loading="lazy" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(m.youtube)+'" title="Видео"></iframe>':m.url?'<img class="photo" loading="lazy" src="'+escapeHtml(m.url)+'" alt="Мем" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'photo\',textContent:\'😂\'}))">':'<div class="photo">'+escapeHtml(m.emoji||'😂')+'</div>')+'<div class="info"><h2>'+escapeHtml(m.title)+'</h2><div class="actions">'+(m.file?'<span class="muted">🎬 Видео</span>':(m.youtube||m.file)?'<span class="muted">🎬 Видео</span>':'<button onclick="like('+m.id+')">'+(likes.includes(m.id)?'❤️':'🤍')+' '+(likes.includes(m.id)?'В избранном':'Нравится')+'</button>')+'</div></div></article>').join(''):'<div class="panel glass">Здесь пока пусто 👀</div>'}function addMeme(){let title=document.getElementById('caption').value.trim(),url=document.getElementById('imageurl').value.trim();if(!title||!/^https:\/\//i.test(url)){alert('Введи подпись и ссылку на фото, начинающуюся с https://');return}memes.unshift({id:Date.now(),title,url});save();document.getElementById('caption').value='';document.getElementById('imageurl').value='';render()}function addVideo(){let url=document.getElementById('videourl').value.trim(),title=document.getElementById('videotitle').value.trim()||'Видео';let match=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);if(!match){alert('Вставь ссылку на YouTube');return}videos.unshift({id:Date.now(),title,youtube:match[1]});save();render()}render();
</script></body></html>
