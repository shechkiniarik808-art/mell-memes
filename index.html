<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#120d22"><title>MELL MEMES</title><style>
*{box-sizing:border-box}body{margin:0;color:white;background:radial-gradient(circle at 10% 0%,#6938a3 0,transparent 40%),linear-gradient(140deg,#171126,#090911);font:16px system-ui,-apple-system,sans-serif;min-height:100vh}header{padding:30px 20px 18px;text-align:center}h1{font-size:38px;letter-spacing:-2px;margin:4px}small{color:#bcb4d4}.glass{background:#ffffff12;border:1px solid #ffffff25;box-shadow:0 12px 40px #0004;backdrop-filter:blur(18px);border-radius:25px}.wrap{max-width:900px;margin:auto;padding:0 16px 60px}.tabs{display:flex;gap:10px;padding:8px;margin-bottom:22px;position:sticky;top:8px;z-index:3}.tabs button{flex:1}.btn,button{border:0;color:white;background:#ffffff19;padding:12px 16px;border-radius:17px;font:inherit;cursor:pointer}.active,.primary{background:linear-gradient(120deg,#a34eff,#6332d7)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}.card{overflow:hidden}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;background:linear-gradient(135deg,#a047fa,#25143b);display:grid;place-items:center;font-size:65px}.card .info{padding:16px}.card h2{font-size:20px;margin:0 0 12px}.actions{display:flex;gap:8px;align-items:center}.actions button{font-size:15px}.muted{color:#bdb3d1;font-size:13px}.panel{padding:20px;margin-bottom:20px}.panel input{width:100%;margin:8px 0 12px;padding:13px;border-radius:14px;border:1px solid #ffffff45;background:#ffffff12;color:white;font:inherit}a{color:#d8b5ff}footer{text-align:center;color:#a59abf;padding:20px}.hidden{display:none}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#15121e}video{width:100%;aspect-ratio:9/12;object-fit:contain;background:#090911;display:block}.notice{padding:12px;color:#d8b5ff}

/* Dark violet-to-black gradient and clean iOS-style tabs */
body{background:radial-gradient(ellipse at 0% 0%,rgba(128,64,202,.58) 0%,rgba(70,34,112,.28) 34%,transparent 65%),linear-gradient(135deg,#28143f 0%,#120d1e 47%,#030306 100%);background-attachment:fixed}
.tabs{gap:5px;padding:6px;border-radius:23px;overflow:hidden;isolation:isolate;background:rgba(27,25,42,.74);border:1px solid rgba(255,255,255,.13)}
.tabs button{min-width:0;padding:12px 5px;border-radius:17px;background:transparent;box-shadow:none;transition:background .2s,box-shadow .2s,color .2s;font-size:clamp(12px,3.5vw,16px);white-space:nowrap}
.tabs button.active{background:linear-gradient(145deg,rgba(80,160,255,.93),rgba(45,93,218,.95));box-shadow:inset 0 1px 0 #ffffff55,0 3px 14px #2976ff44;color:#fff}
.tabs button:focus-visible{outline:2px solid #9dc5ff;outline-offset:-3px}
.player{position:relative;background:#050507;overflow:hidden;aspect-ratio:9/12;display:flex;align-items:center;justify-content:center}
.player video{width:100%;height:100%;aspect-ratio:auto;object-fit:contain}
.player-toggle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:66px;height:66px;padding:0;border-radius:50%;background:rgba(45,45,54,.40);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;box-shadow:0 5px 24px #0005;transition:opacity .2s,background .2s;z-index:1}
.player-toggle svg{width:27px;height:27px;fill:white;stroke:white;stroke-linecap:round;stroke-linejoin:round}
.player.playing .player-toggle{opacity:0;pointer-events:none}
.player.playing:active .player-toggle,.player.playing:focus-within .player-toggle{opacity:1;pointer-events:auto}
.player-bottom{position:absolute;bottom:0;left:0;right:0;padding:22px 12px 10px;display:flex;align-items:center;gap:9px;background:linear-gradient(transparent,#0009);opacity:1;transition:opacity .2s}
.player-bottom input{flex:1;min-width:0;accent-color:#90baff;height:20px;cursor:pointer}
.player-bottom button{background:#ffffff2c;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:12px;padding:6px 10px;font-size:14px}
.player-bottom .time{font-size:12px;font-variant-numeric:tabular-nums;color:#eee;white-space:nowrap}
@media(max-width:390px){.tabs{gap:2px;padding:5px}.tabs button{font-size:12px;padding:12px 3px}}
</style></head><body><header><div>💜 ФАН-САЙТ</div><h1>MELL MEMES 💀</h1><small>Мемы, реакции и видео • стеклянный дизайн</small></header><main class="wrap"><nav class="tabs glass"><button id="photos" class="active" onclick="tab('photos')">😂 Мемы</button><button id="videos" onclick="tab('videos')">🎬 Видео</button><button id="saved" onclick="tab('saved')">❤️ Избранное</button></nav><section id="add" class="panel glass"><h2>Добавить свой мем</h2><input id="caption" placeholder="Подпись к мему"><input id="imageurl" placeholder="Ссылка на фото (https://...)"><button class="primary" onclick="addMeme()">Добавить фото</button><p class="muted">Добавленные мемы и лайки сохраняются только в этом браузере.</p></section><section id="addvideo" class="panel glass hidden"><h2>Добавить YouTube-видео</h2><input id="videourl" placeholder="Ссылка на YouTube"><input id="videotitle" placeholder="Название ролика"><button class="primary" onclick="addVideo()">Добавить видео</button><p class="muted">Встраивание зависит от разрешений автора ролика.</p></section><section id="feed" class="grid"></section><footer>Неофициальный фан-сайт • MELL MEMES</footer></main><script>
const defaults=[{id:1,title:'КОГДА ЗАШЁЛ НА СТРИМ НА 5 МИНУТ 💀',emoji:'😭'},{id:2,title:'КОГДА УВИДЕЛ ОЦЕНКУ ПО ГЕОМЕТРИИ',emoji:'🤯'},{id:3,title:'ТОТ САМЫЙ МОМЕНТ НА СТРИМЕ',emoji:'😂'},{id:4,title:'КОГДА ИНТЕРНЕТ ЗАЛАГАЛ В САМЫЙ ВАЖНЫЙ МОМЕНТ',emoji:'🗿'}];const get=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};const publicVideos=[{id:101,title:'MELL MEMES — видео №1',file:'72e76e27edeb89e30c460ca87a0e5b95.mp4'},{id:102,title:'MELL MEMES — видео №2',file:'TikTok_7686169800334265633.mp4'},{id:103,title:'MELL MEMES — видео №3',file:'TikTok_7604730203708951830.mp4'},{id:104,title:'MELL MEMES — видео №4',file:'TikTok_7665258243047951623.mp4'},{id:105,title:'MELL MEMES — видео №5',file:'ddecd6bbd25e87d3eb32025a1f1de95c.mp4'},{id:106,title:'MELL MEMES — видео №6',file:'TikTok_7655459808241339668.mp4'}];let memes=get('mell-memes',defaults),videos=[...publicVideos,...get('mell-videos',[])],likes=get('mell-likes',[]),views=get('mell-views',{}),mode='photos';const save=()=>{localStorage.setItem('mell-memes',JSON.stringify(memes));localStorage.setItem('mell-videos',JSON.stringify(videos.filter(v=>!v.file)));localStorage.setItem('mell-likes',JSON.stringify(likes))};const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function tab(t){mode=t;for(const b of ['photos','videos','saved'])document.getElementById(b).classList.toggle('active',b===t);document.getElementById('add').classList.toggle('hidden',t!=='photos');document.getElementById('addvideo').classList.toggle('hidden',t!=='videos');render()}function like(id){likes=likes.includes(id)?likes.filter(x=>x!==id):[...likes,id];save();render()}function countView(el,id){if(el.dataset.counted)return;el.dataset.counted='1';views[id]=(views[id]||0)+1;localStorage.setItem('mell-views',JSON.stringify(views));const counter=document.getElementById('views-'+id);if(counter)counter.textContent='👁️ '+views[id]+' просмотров на этом устройстве'}function togglePlayer(btn){const v=btn.closest('.player').querySelector('video');if(v.paused){document.querySelectorAll('.player video').forEach(other=>{if(other!==v&&!other.paused)other.pause()});v.play().catch(()=>{})}else v.pause()}
function playerState(v,id,playing){const p=v.closest('.player');if(!p)return;p.classList.toggle('playing',playing);p.querySelector('.player-toggle').innerHTML=playing?'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';if(playing)countView(v,id)}
function playerTime(v){const p=v.closest('.player');if(!p)return;const t=n=>{n=Math.floor(Number.isFinite(n)?n:0);return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')};p.querySelector('.time').textContent=t(v.currentTime)+' / '+t(v.duration);if(Number.isFinite(v.duration)&&v.duration>0)p.querySelector('input').value=Math.round(v.currentTime/v.duration*1000)}
function seekPlayer(el){const v=el.closest('.player').querySelector('video');if(Number.isFinite(v.duration)&&v.duration>0)v.currentTime=v.duration*el.value/1000}
function fullPlayer(btn){const v=btn.closest('.player').querySelector('video');if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else if(v.requestFullscreen)v.requestFullscreen()}
function render(){const list=mode==='videos'?videos:mode==='saved'?[...memes,...videos].filter(m=>likes.includes(m.id)):memes;document.getElementById('feed').innerHTML=list.length?list.map(m=>'<article class="card glass">'+(m.file?'<div class="player"><video playsinline preload="metadata" onplay="playerState(this,'+m.id+',true)" onpause="playerState(this,'+m.id+',false)" onended="playerState(this,'+m.id+',false)" ontimeupdate="playerTime(this)" onloadedmetadata="playerTime(this)" src="'+escapeHtml(m.file)+'"></video><button class="player-toggle" onclick="togglePlayer(this)" aria-label="Воспроизвести или поставить на паузу"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button><div class="player-bottom"><span class="time">0:00</span><input type="range" min="0" max="1000" value="0" aria-label="Перемотка" oninput="seekPlayer(this)"><button onclick="fullPlayer(this)" aria-label="Полный экран">⛶</button></div></div>':m.youtube?'<iframe loading="lazy" allowfullscreen src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(m.youtube)+'" title="Видео"></iframe>':m.url?'<img class="photo" loading="lazy" src="'+escapeHtml(m.url)+'" alt="Мем">':'<div class="photo">'+escapeHtml(m.emoji||'😂')+'</div>')+'<div class="info"><h2>'+escapeHtml(m.title)+'</h2><div class="actions"><button onclick="like('+m.id+')">'+(likes.includes(m.id)?'❤️ В избранном':'🤍 В избранное')+'</button>'+(m.file?'<a class="btn" href="'+escapeHtml(m.file)+'" download>⬇️ Скачать</a>':'')+'</div></div></article>').join(''):'<div class="panel glass">Здесь пока пусто 👀</div>'}function addMeme(){let title=document.getElementById('caption').value.trim(),url=document.getElementById('imageurl').value.trim();if(!title||!/^https:\/\//i.test(url)){alert('Введи подпись и ссылку на фото, начинающуюся с https://');return}memes.unshift({id:Date.now(),title,url});save();document.getElementById('caption').value='';document.getElementById('imageurl').value='';render()}function addVideo(){let url=document.getElementById('videourl').value.trim(),title=document.getElementById('videotitle').value.trim()||'Видео';let match=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);if(!match){alert('Вставь ссылку на YouTube');return}videos.unshift({id:Date.now(),title,youtube:match[1]});save();render()}render();
</script></body></html>
